{% extends "base.html" %}

{% block content %}
        <div class="grid">
            <!-- SENSORES -->
            <div class="card">
                <h2>📊 Sensores</h2>
                <div
                    hx-get="/api/sensores/ultima"
                    hx-trigger="load, every 10s"
                    hx-swap="innerHTML"
                    id="sensores-container"
                >
                    <div style="text-align: center; color: #999;">
                        Cargando sensores...
                    </div>
                </div>
            </div>

            <!-- DISPOSITIVOS -->
            <div class="card">
                <h2>⚙️ Dispositivos</h2>
                <div
                    hx-get="/api/dispositivos"
                    hx-trigger="load, every 15s"
                    hx-swap="innerHTML"
                    id="dispositivos-container"
                >
                    <div style="text-align: center; color: #999;">
                        Cargando dispositivos...
                    </div>
                </div>
            </div>

            <!-- HISTORIAL -->
            <div class="card">
                <h2>📈 Historial</h2>
                <div
                    hx-get="/api/sensores"
                    hx-trigger="load, every 30s"
                    hx-swap="innerHTML"
                    id="historial-container"
                >
                    <div style="text-align: center; color: #999;">
                        Cargando historial...
                    </div>
                </div>
            </div>
        </div>

        <!-- STATUS -->
        <div class="card" style="text-align: center;">
            <span
                hx-get="/salud"
                hx-trigger="every 60s"
                hx-swap="innerHTML"
                id="health-status"
            >
                ✅ Sistema en línea
            </span>
            <div class="timestamp" id="timestamp"></div>
        </div>
{% endblock %}
