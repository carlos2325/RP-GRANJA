<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 Granja IoT</title>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #e91e63;
            border-bottom: 2px solid #e91e63;
            padding-bottom: 10px;
        }

        .sensor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .sensor-label {
            font-weight: 500;
            color: #555;
        }

        .sensor-valor {
            font-size: 1.4em;
            font-weight: bold;
            color: #e91e63;
        }

        .device-control {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .device-name {
            flex: 1;
            font-weight: 500;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-on {
            background: #10b981;
            color: white;
        }

        .btn-on:hover {
            background: #059669;
        }

        .btn-off {
            background: #ef4444;
            color: white;
        }

        .btn-off:hover {
            background: #dc2626;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status-on {
            background: #d1fae5;
            color: #065f46;
        }

        .status-off {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .timestamp {
            font-size: 0.85em;
            color: #999;
            margin-top: 15px;
            text-align: right;
        }

        .alerta {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .alerta.error {
            background: #fee2e2;
            border-left-color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌾 Granja IoT</h1>
            <p class="subtitle">Sistema de Monitoreo en Tiempo Real</p>
        </header>

        <div class="grid">
            <!-- SENSORES -->
            <div class="card">
                <h2>📊 Sensores</h2>
                <div
                    hx-get="/api/sensores/ultima"
                    hx-trigger="load, every 10s"
                    hx-swap="innerHTML"
                    id="sensores-container"
                >
                    <div style="text-align: center; color: #999;">
                        Cargando sensores...
                    </div>
                </div>
            </div>

            <!-- DISPOSITIVOS -->
            <div class="card">
                <h2>⚙️ Dispositivos</h2>
                <div
                    hx-get="/api/dispositivos"
                    hx-trigger="load, every 15s"
                    hx-swap="innerHTML"
                    id="dispositivos-container"
                >
                    <div style="text-align: center; color: #999;">
                        Cargando dispositivos...
                    </div>
                </div>
            </div>

            <!-- HISTORIAL -->
            <div class="card">
                <h2>📈 Historial</h2>
                <div
                    hx-get="/api/sensores"
                    hx-trigger="load, every 30s"
                    hx-swap="innerHTML"
                    id="historial-container"
                >
                    <div style="text-align: center; color: #999;">
                        Cargando historial...
                    </div>
                </div>
            </div>
        </div>

        <!-- STATUS -->
        <div class="card" style="text-align: center;">
            <span
                hx-get="/salud"
                hx-trigger="every 60s"
                hx-swap="innerHTML"
                id="health-status"
            >
                ✅ Sistema en línea
            </span>
            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>

    <script>
        // Actualizar timestamp
        function updateTimestamp() {
            const now = new Date().toLocaleString('es-ES');
            document.getElementById('timestamp').textContent = now;
        }
        updateTimestamp();
        setInterval(updateTimestamp, 1000);

        // Indicadores de carga HTMX
        htmx.on('htmx:xhr:loadstart', (detail) => {
            detail.xhr.addEventListener('load', () => {
                // Animación opcional
            });
        });
    </script>
</body>
</html>
