<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}🌾 Granja IoT{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <style>
        :root {
            --bg0: #ff9a9e;
            --bg1: #fecfef;
            --card: #ffffff;
            --ink: #1f2937;
            --muted: #6b7280;
            --brand: #e91e63;
            --ok-bg: #d1fae5;
            --ok-ink: #065f46;
            --bad-bg: #fee2e2;
            --bad-ink: #7f1d1d;
            --shadow: 0 10px 30px rgba(0,0,0,0.2);
            --shadow-hover: 0 15px 40px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg0) 0%, var(--bg1) 100%);
            color: var(--ink);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; color: white; margin-bottom: 18px; }
        h1 { font-size: 2.35em; margin-bottom: 8px; letter-spacing: -0.02em; }
        .subtitle { font-size: 1.05em; opacity: 0.92; }

        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px 0 28px;
        }

        .nav a {
            text-decoration: none;
            color: white;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, background 0.15s ease;
            font-weight: 600;
        }

        .nav a:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.22);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .card h2 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: var(--brand);
            border-bottom: 2px solid var(--brand);
            padding-bottom: 10px;
        }

        .sensor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .sensor-label { font-weight: 500; color: #555; }
        .sensor-valor { font-size: 1.4em; font-weight: bold; color: var(--brand); }

        .device-control {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .device-name { flex: 1; font-weight: 500; }

        button, .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-on { background: #10b981; color: white; }
        .btn-on:hover { background: #059669; }
        .btn-off { background: #ef4444; color: white; }
        .btn-off:hover { background: #dc2626; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
        }

        .status-on { background: var(--ok-bg); color: var(--ok-ink); }
        .status-off { background: var(--bad-bg); color: var(--bad-ink); }

        .timestamp {
            font-size: 0.85em;
            color: #999;
            margin-top: 15px;
            text-align: right;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
        }

        .table th, .table td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }

        .table th {
            color: #374151;
            background: #fafafa;
            font-weight: 800;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.92em;
        }

        .doc {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
            color: #111827;
        }

        .pill {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #fff0f6;
            color: #9d174d;
            font-weight: 800;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌾 Granja IoT</h1>
            <p class="subtitle">Sistema de Monitoreo en Tiempo Real</p>
        </header>

        <nav class="nav">
            <a href="/">Dashboard</a>
            <a href="/hardware">Hardware</a>
            <a href="/api">API</a>
            <a href="/docs">Docs</a>
        </nav>

        {% block content %}{% endblock %}
    </div>

    <script>
        function updateTimestamp() {
            const el = document.getElementById('timestamp');
            if (!el) return;
            el.textContent = new Date().toLocaleString('es-ES');
        }
        updateTimestamp();
        setInterval(updateTimestamp, 1000);
    </script>
</body>
</html>
